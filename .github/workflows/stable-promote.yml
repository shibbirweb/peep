# Opens the develop to main pull request once a stable release is merged into develop.
#
# stable.yml opens a release pull request that moves develop to a stable version. Once that is merged and
# CI has passed on develop, this opens the second pull request, develop into main, with the release notes
# in its description. Merging it (with a merge commit, never squash, so main stays an ancestor of develop)
# is the last decision; stable-publish.yml does the rest once CI passes on main.
#
# It runs whenever CI finishes on a push to develop, and acts only when CI passed, develop is at a stable
# version with no tag yet, and no such pull request is open already: every other run ends with a note.
name: Promote stable

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: stable-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Open the develop to main pull request
    runs-on: ubuntu-latest
    # Only CI that passed, on a push to develop. A pull request's CI never promotes anything.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Is there a stable release to promote?
        id: check
        run: |
          version="$(bun scripts/version.ts show)"
          if [ "$version" = "0.0.0" ]; then
            echo "The version is 0.0.0, the placeholder before the first release. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$version" in
            *-*)
              echo "develop is at $version, a beta. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The same rule as stable.yml: nothing that changes the program may ride along untried.
          untried="$(bun scripts/version.ts untried)"
          if [ -n "$untried" ]; then
            {
              echo "::error::develop has changes since the last beta that nobody has tried, so v$version is not promoted to main."
              echo "Run Beta release to put them in a beta, then Stable release again."
              printf '%s\n' "$untried"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ticket=$(bun scripts/version.ts next-ticket)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request into main
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          TITLE: chore:[REL-${{ steps.check.outputs.ticket }}] promote ${{ steps.check.outputs.version }} to main
        run: |
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open \
            --json url --jq '.[0].url // ""')"
          if [ -n "$open" ]; then
            echo "A pull request from develop into main is already open: $open" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! bun scripts/version.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo '_No user visible changes are recorded in CHANGELOG.md for this version._' > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo "Merging this releases **v$VERSION** to everybody. Once CI passes on main, Publish stable"
            echo "publishes the release from main with the PHARs and the desktop apps, updates Packagist when"
            echo "that is switched on, and every desktop install on the stable channel is offered it."
            echo ''
            echo 'Merge it with a merge commit, not squash, so main stays part of develop'"'"'s history.'
            echo 'This pull request follows develop, so anything merged into develop before it is merged goes'
            echo 'to main with it. Merge it before merging other work.'
            echo ''
            echo '## Release notes'
            echo ''
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          if ! url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head develop \
                --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" 2>&1)"; then
            echo "$url"
            echo "::error::GitHub would not open the pull request into main. Open it by hand from develop, or re-run this once the cause above is fixed."
            exit 1
          fi
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
