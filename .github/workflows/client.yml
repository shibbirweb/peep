name: Client

# Called by ci.yml, which runs on every push to develop and main and on every pull request.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=-1, display_errors=On, zend.assertions=1
          # Composer 2.3+ needs PHP 7.2.5; PHP 7.1 and 7.2 get the 2.2 LTS line.
          tools: composer:${{ (matrix.php == '7.1' || matrix.php == '7.2') && '2.2' || 'v2' }}

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-client-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-client-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  syntax:
    name: Syntax on PHP 7.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.1'
          coverage: none
          tools: none

      - name: Lint every client file with PHP 7.1
        run: |
          find src tests resources -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/peep
          php -l bin/peep-clean

  quality:
    name: Code style, static analysis, compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          composer install --working-dir=tools --prefer-dist --no-interaction --no-progress

      - name: Code style (PSR-12)
        run: composer cs

      - name: PHPStan
        run: composer analyse

      - name: PHP 7.1+ compatibility
        run: composer compat

      - name: PHPStan rule for leftover calls
        run: vendor/bin/phpunit --filter PhpStanRuleTest

  dist:
    name: Composer archive contains only the client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check export-ignore
        run: bash .github/scripts/check-dist.sh

  phar:
    name: Build peep.phar (global install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          ini-values: phar.readonly=0
          tools: composer:v2

      - name: Install Box
        run: composer install --working-dir=tools --prefer-dist --no-interaction --no-progress

      - name: Compile
        run: tools/vendor/bin/box compile --no-interaction

      - uses: actions/upload-artifact@v4
        with:
          name: peep.phar
          path: build/peep.phar
          if-no-files-found: error

  phar-smoke:
    name: peep.phar on PHP ${{ matrix.php }}
    needs: phar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=-1, display_errors=On
          tools: none

      - uses: actions/download-artifact@v4
        with:
          name: peep.phar

      - name: Command line tool
        run: |
          php peep.phar version
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/conf.d"
          HOME="$RUNNER_TEMP/home" php peep.phar install --ini-dir="$RUNNER_TEMP/conf.d"
          test -f "$RUNNER_TEMP/home/.peep/peep.phar"
          grep -q auto_prepend_file "$RUNNER_TEMP/conf.d/99-peep.ini"
          HOME="$RUNNER_TEMP/home" php peep.phar uninstall --ini-dir="$RUNNER_TEMP/conf.d"
          test ! -f "$RUNNER_TEMP/conf.d/99-peep.ini"

      - name: Loaded through auto_prepend_file
        run: |
          cat > script.php <<'PHP'
          <?php
          if (! function_exists('peep')) {
              fwrite(STDERR, "peep() is missing\n");
              exit(1);
          }
          peep('hello from CI');
          echo (new ReflectionClass('ShibbirWeb\\Peep\\Peep'))->getFileName(), "\n";
          PHP
          php -d auto_prepend_file="$PWD/peep.phar" script.php | grep -q '^phar://'
